<!doctype html>
<html lang="{{ site.lang | default: 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != '' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="theme-color" content="#F3F0E8">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <aside class="sidebar">
    <div class="side-top">
      <a href="{{ '/' | relative_url }}" class="side-logo">Ермек<br>Токтаров</a>
      <span class="side-role">Философ · PhD</span>
      <span class="side-tagline">Философия для жизни</span>
    </div>

    <nav class="side-nav" aria-label="Основная навигация">
      {% for item in site.data.navigation %}
        <a class="side-link{% if page.url == item.url %} active{% endif %}" href="{{ item.url | relative_url }}">
          <span class="nav-symbol">{{ item.symbol }}</span>
          <span>{{ item.title }}</span>
        </a>
      {% endfor %}
    </nav>

    <div class="side-divider"></div>
    <div class="side-social">
      <a href="{{ site.data.profile.instagram }}" target="_blank" rel="noopener">Instagram</a>
      <a href="{{ site.data.profile.scholar }}" target="_blank" rel="noopener">Google Scholar</a>
      <a href="{{ site.data.profile.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
    </div>

    <div class="side-mark" aria-hidden="true"><span></span><i></i><b>?</b></div>
  </aside>

  <main class="main" id="content">
    {{ content }}
  </main>
</body>
</html>
